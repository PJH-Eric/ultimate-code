# Cloudflare 備援 Worker（Durable Object 承載 server.js）
# 由 .github/workflows/deploy-cloudflare.yml 先用 game-lobby/cloudflare/build.cjs 打包成 cloudflare/dist/worker.mjs，再部署。
# 帳號 ID 由 CI 的 CLOUDFLARE_ACCOUNT_ID 環境變數提供，不寫進 repo。
name = "ultimate-code-backup"
main = "dist/worker.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "GameLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameLobby"]
