name: 部署 Cloudflare 備援 Worker

# 每次 push 到 main 時，用 game-lobby 的共用打包器把本遊戲打包成 Durable Object Worker 並部署。
# 需要的 secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   權限：Workers Scripts:Edit、Durable Objects:Edit（在 dash.cloudflare.com 建立）
#   CLOUDFLARE_ACCOUNT_ID  帳號 ID
#   GAME_LOBBY_TOKEN       （只有 game-lobby 是私人 repo 時才需要）讀取 PJH-Eric/game-lobby 的 token

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 打包器要求「<根>/<遊戲名>/server.js」，所以本 repo 放在 ultimate-code/ 子目錄
      - uses: actions/checkout@v4
        with:
          path: ultimate-code

      - name: 取得 game-lobby（共用的 Cloudflare 打包器）
        uses: actions/checkout@v4
        with:
          repository: PJH-Eric/game-lobby
          path: game-lobby
          token: ${{ secrets.GAME_LOBBY_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"

      - name: 安裝 game-lobby 的打包依賴
        working-directory: game-lobby/cloudflare
        run: npm ci

      - name: 打包本遊戲為 Worker
        env:
          GAME_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          mkdir -p ultimate-code/cloudflare/dist
          node game-lobby/cloudflare/build.cjs ultimate-code ultimate-code/cloudflare/dist/worker.mjs
          test -s ultimate-code/cloudflare/dist/worker.mjs

      - name: 部署 Worker
        working-directory: ultimate-code/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: 驗證線上 /health
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://ultimate-code-backup.eric-games.workers.dev/health" | grep -q '"ok":true'; then echo "Worker 正常"; exit 0; fi
            sleep 5
          done
          echo "Worker /health 未通過"; exit 1
