<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E0">
<title>終極密碼｜免費線上猜數字派對遊戲</title>
<meta name="description" data-i18n-content="doc.desc" content="免費免下載的終極密碼：密碼藏在 1～100，範圍越猜越小，猜中的人輸！還有 +1／+2／+3 累加模式、跳過／迴轉／指定道具、單人挑戰與線上紅藍組隊。">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lobby-chat.css">
<link rel="stylesheet" href="css/latency.css">
<link rel="stylesheet" href="css/server-outage.css">
<script src="js/server-outage.js"></script>
<script src="/game-lobby/backend-routing.js"></script>
</head>
<body>
<div id="app" data-screen="boot" data-side="closed">
  <header id="topbar" class="topbar">
    <div class="top-left">
      <a id="btn-lobby" class="pill-btn lobby-pill" href="#" hidden><span class="pill-ico" data-icon="back"></span><span data-i18n="top.lobby">遊戲大廳</span></a>
      <button id="btn-back" class="icon-btn" type="button" hidden data-i18n-attr="aria-label=top.back;title=top.back"><span data-icon="back"></span></button>
      <button id="btn-side" class="icon-btn" type="button" hidden aria-expanded="false" data-i18n-attr="aria-label=top.side;title=top.side"><span data-icon="panel"></span><i id="side-badge" class="badge" hidden>0</i></button>
    </div>
    <div class="top-title" id="top-title"></div>
    <div class="top-right">
      <span class="lat-slot"></span>
      <button id="btn-lang" class="icon-btn" type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n-attr="aria-label=top.lang;title=top.lang"><span data-icon="globe"></span></button>
      <button id="btn-settings" class="icon-btn" type="button" aria-haspopup="dialog" data-i18n-attr="aria-label=top.settings;title=top.settings"><span data-icon="gear"></span></button>
    </div>
  </header>

  <main id="main">
    <section id="scr-home" class="screen scroll" aria-labelledby="home-title"></section>
    <section id="scr-solo" class="screen scroll"></section>
    <section id="scr-records" class="screen scroll"></section>
    <section id="scr-help" class="screen scroll"></section>
    <section id="scr-lobby" class="screen scroll"></section>
    <section id="scr-room" class="screen"></section>
    <section id="scr-game" class="screen">
      <div id="side-backdrop" class="side-backdrop" hidden></div>
      <aside id="side" class="side" data-i18n-attr="aria-label=side.aria">
        <div class="side-head"><h2 class="side-title" data-i18n="side.summary">對局資訊</h2>
          <button id="side-close" class="icon-btn small" type="button" data-i18n-attr="aria-label=common.close"><span data-icon="close"></span></button></div>
        <div id="summary" class="summary scroll"></div>
        <section id="chatbox" class="chatbox" hidden data-i18n-attr="aria-label=chat.title">
          <h2 class="side-title small" id="chat-title" data-i18n="chat.title">聊天室</h2>
          <ul id="chat-list" class="chat-list scroll" aria-live="polite"></ul>
          <p id="chat-off" class="chat-off" hidden></p>
          <div id="chat-quick" class="chat-quick"></div>
          <form id="chat-form" class="chat-form" autocomplete="off">
            <label class="input-wrap"><input id="chat-input" type="text" maxlength="200" data-i18n-attr="placeholder=chat.ph;aria-label=chat.ph"></label>
            <button type="submit" class="btn small primary icon-only" data-i18n-attr="aria-label=chat.send;title=chat.send"><span data-icon="send"></span></button>
          </form>
        </section>
      </aside>
      <div class="g-center scroll" id="g-center">
        <div class="g-players" id="g-players" role="list" data-i18n-attr="aria-label=game.players"></div>
        <div class="g-turn" id="g-turn" aria-live="polite"></div>
        <div class="g-board" id="g-board"></div>
      </div>
      <div class="g-right" id="g-right">
        <h2 class="box-title"><span data-icon="history"></span><span data-i18n="game.history">紀錄</span></h2>
        <ol class="history scroll" id="history" aria-live="polite"></ol>
      </div>
      <nav class="g-tabs" id="g-tabs" role="tablist">
        <button type="button" role="tab" data-gt="play" aria-selected="true"><span data-icon="safe"></span><span data-i18n="gt.play">遊戲</span></button>
        <button type="button" role="tab" data-gt="hist" aria-selected="false"><span data-icon="history"></span><span data-i18n="gt.hist">紀錄</span><i class="badge" id="gt-hist-badge" hidden></i></button>
      </nav>
      <div id="countdown" class="countdown" role="status" aria-live="assertive" hidden><b class="cd-num"></b></div>
      <div id="result-layer" class="result-layer" hidden></div>
    </section>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="boot" class="boot" role="status"><div class="boot-safe"></div></div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/locales.js"></script>
<script src="js/locales-hans.js"></script>
<script src="js/config.js"></script>
<script src="js/lobby-link.js"></script>
<script src="js/core/rules.js"></script>
<script src="js/art/registry.js"></script>
<script src="js/art/icons.js"></script>
<script src="js/art/icons-uc.js"></script>
<script src="js/art/host.js"></script>
<script src="js/art/avatars.js"></script>
<script src="js/art/digits.js"></script>
<script src="js/audio.js"></script>
<script src="js/latency.js"></script>
<script src="js/lobby-chat.js"></script>
<script src="js/online.js"></script>
<script src="js/ui/kit.js"></script>
<script src="js/ui/board.js"></script>
<script src="js/ui/result.js"></script>
<script src="js/modes/solo.js"></script>
<script src="js/modes/online-ui.js"></script>
<script src="js/app.js"></script>
<script defer src="js/locales/result-share.js"></script>
<script defer src="js/result-share.js"></script>
</body>
</html>
