<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1200px;height:630px}
.blob.a{width:560px;height:560px;left:20px;top:40px;background:radial-gradient(circle,#FFD3C7 0,#FFE8E0 58%,transparent 72%)}
.blob.b{width:280px;height:280px;right:60px;bottom:-90px;background:radial-gradient(circle,#BFEFDD 0,transparent 70%)}
.grid{left:70px;top:150px;width:390px;height:390px;transform:rotate(-6deg)}
#host{position:absolute;left:290px;top:150px;width:320px;height:320px;filter:drop-shadow(0 18px 0 rgba(38,64,94,.18))}
.dialbox{position:absolute;left:110px;top:44px;transform:rotate(-4deg);display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--gold);border:6px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 rgba(38,64,94,.28)}
.dialbox .dial span{width:56px;height:70px;border-width:4px;border-radius:14px}
.dialbox b{font-size:52px;font-weight:900}
.chip.mine{left:40px;top:470px;width:110px;height:110px;background:var(--peach-l);transform:rotate(10deg)}
.chip.mine svg{color:var(--red)}
.title{position:absolute;left:610px;top:112px;width:560px}
.title .main{font-size:124px;white-space:nowrap;font-weight:900;letter-spacing:.04em;line-height:1.08;text-shadow:6px 6px 0 var(--gold)}
.title .row{margin-top:14px}
.title .tag{display:inline-block;font-size:72px;font-weight:900;color:var(--paper);background:var(--peach-d);border:6px solid var(--ink);border-radius:28px;padding:0 28px;line-height:1.3;box-shadow:0 10px 0 var(--ink);transform:rotate(-4deg)}
.title .sub{margin-top:40px;font-size:36px;white-space:nowrap;font-weight:800;color:var(--ink-soft);letter-spacing:.04em}
.title .sub b{display:inline-block;margin-right:14px;padding:2px 18px;background:var(--mint-l);border:3px solid var(--ink);border-radius:999px;color:var(--ink)}
</style>
<script src="../../public/js/art/registry.js"></script>
<script src="../../public/js/art/icons.js"></script>
<script src="../../public/js/art/icons-uc.js"></script>
<script src="../../public/js/art/host.js"></script>
<script src="../../public/js/art/digits.js"></script>
<div class="blob a"></div><div class="blob b"></div>
<div class="grid" id="grid"></div>
<div class="dialbox"><span class="dial" id="lo"></span><b>～</b><span class="dial" id="hi"></span></div>
<div id="host"></div>
<div class="chip mine" id="mine"></div>
<div class="title"><div class="main">終極密碼</div><div class="row"><span class="tag">猜中就輸！</span></div><div class="sub"><b>免費</b>線上猜數字派對</div></div>
<script>
function dial(id,n){document.getElementById(id).innerHTML=String(n).split('').map(function(c){return '<span>'+Art.svg('digits',+c)+'</span>'}).join('')}
var g='';for(var v=1;v<=100;v++)g+='<i class="'+(v<31||v>59?'out':'')+(v===42?' sel':'')+'"></i>';document.getElementById('grid').innerHTML=g;
dial('lo',31);dial('hi',59);
document.getElementById('host').innerHTML=Art.svg('host',2);
var ic=Art.get('icons').items;function icon(k){for(var i=0;i<ic.length;i++)if(ic[i].key===k)return Art.svg('icons',i);return ''}
document.getElementById('mine').innerHTML=icon('mine');
</script>
