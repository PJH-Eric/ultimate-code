<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1200px;height:675px}
.blob.a{width:780px;height:780px;left:210px;top:-60px;background:radial-gradient(circle,#FFD3C7 0,#FFE8E0 55%,transparent 70%)}
.blob.b{width:320px;height:320px;left:-70px;bottom:-100px;background:radial-gradient(circle,#BFEFDD 0,transparent 70%)}
.blob.c{width:300px;height:300px;right:-60px;top:-80px;background:radial-gradient(circle,#FFE49A 0,transparent 70%)}
.grid{left:600px;top:120px;width:440px;height:440px;transform:rotate(5deg)}
#host{position:absolute;left:200px;top:150px;width:400px;height:400px;filter:drop-shadow(0 18px 0 rgba(38,64,94,.18))}
.bar{position:absolute;left:150px;top:578px;width:900px;height:44px;border-radius:24px;background:repeating-linear-gradient(90deg,#FFE9C7 0 9.6%,#F4DDB4 9.6% 10%);border:6px solid var(--ink);box-shadow:0 9px 0 rgba(38,64,94,.25)}
.bar i{position:absolute;top:4px;bottom:4px;left:30%;width:30%;border-radius:16px;background:var(--mint);border:4px solid var(--mint-d)}
.chip.skip{left:96px;top:96px;width:120px;height:120px;background:#DDF6FF;transform:rotate(-10deg)}
.chip.rev{left:1050px;top:300px;width:112px;height:112px;background:#FFF1C6;transform:rotate(8deg)}
.chip.assign{left:120px;top:400px;width:104px;height:104px;background:#F1E6FF;transform:rotate(6deg)}
.chip.mine{left:960px;top:60px;width:120px;height:120px;background:var(--peach-l);transform:rotate(-8deg)}
.chip.mine svg{color:var(--red)}
.star{position:absolute;color:var(--gold-d);font-size:52px}
</style>
<script src="../../public/js/art/registry.js"></script>
<script src="../../public/js/art/icons.js"></script>
<script src="../../public/js/art/icons-uc.js"></script>
<script src="../../public/js/art/host.js"></script>
<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
<div class="grid" id="grid"></div>
<div id="host"></div>
<div class="bar"><i></i></div>
<div class="chip skip" id="skip"></div><div class="chip rev" id="rev"></div><div class="chip assign" id="assign"></div><div class="chip mine" id="mine"></div>
<span class="star" style="left:560px;top:40px">★</span><span class="star" style="left:1080px;top:520px;font-size:40px">★</span><span class="star" style="left:60px;top:300px;font-size:40px">★</span>
<script>
var g='';for(var v=1;v<=100;v++)g+='<i class="'+(v<31||v>59?'out':'')+(v===42?' sel':'')+(v===73?' mine':'')+'"></i>';document.getElementById('grid').innerHTML=g;
document.getElementById('host').innerHTML=Art.svg('host',5);
var ic=Art.get('icons').items;function icon(k){for(var i=0;i<ic.length;i++)if(ic[i].key===k)return Art.svg('icons',i);return ''}
[['skip','skip'],['rev','reverse'],['assign','assign'],['mine','mine']].forEach(function(p){document.getElementById(p[0]).innerHTML=icon(p[1])});
</script>
