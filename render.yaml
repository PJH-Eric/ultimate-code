# Render Blueprint：只部署後端（HTTP + WebSocket）。前端由 GitHub Pages 提供。
# 綁定方式：Render Dashboard → New → Blueprint → 選 PJH-Eric/ultimate-code（main）。
# autoDeploy：每次 push 到 main 自動部署（Render 會先等 /health 通過才切流量）。
# 注意：Render 不能修改既有服務的 region，這份設定只對「新建」的服務生效。
services:
  - type: web
    name: ultimate-code
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "26.12.1"
      - key: GAME_ALLOWED_ORIGIN
        value: https://pjh-eric.github.io
